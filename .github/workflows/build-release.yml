name: Build Release

# The app ships as a web page. This used to package Electron binaries for Windows and Linux; the
# desktop build was retired when the solver moved into a Web Worker (Chromium blocks module Workers
# from the file:// origin a packaged Electron app loads from), so a tag now produces the static site.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Bundle the site
        run: |
          version=$(node -p "require('./package.json').version")
          zip -r "POE2HTC-web-v${version}.zip" dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/**

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        # Pinned to a COMMIT, not the `v2` tag. A tag is mutable: whoever controls the action can
        # repoint it at new code, which then runs inside this job — and this job holds
        # `contents: write` on your repository. First-party actions/* and github/* by tag is normal
        # practice; a third-party action with write access is the one that earns a SHA.
        # 3bb1273 is the v2 tag as of 2026-08-24 (release 2.6.2). To update: re-resolve the tag,
        # read the diff, then move this deliberately.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: POE2HTC-web-*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
