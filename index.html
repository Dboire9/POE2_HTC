<!DOCTYPE html>
<!-- `dark` is static: src/index.css defines a single dark palette on :root and there is no theme
     toggle, so Tailwind's dark: variants should always be active. Without this class they are all
     inert and their light-mode fallbacks (text-rose-600, text-amber-700, …) render on the dark
     background — which is low-contrast and was the bug this fixes. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>POE2HTC - Path of Exile 2 Crafting Calculator & Optimizer</title>
    <meta name="description" content="Free Path of Exile 2 crafting calculator. Find optimal crafting paths, calculate probabilities, and simulate item crafting with currencies. Best PoE2 crafting tool 2025." />
    <meta name="keywords" content="Path of Exile 2, PoE2, crafting calculator, item crafting, currency optimizer, crafting simulator, PoE2 tools, path of exile crafting" />
    <meta name="author" content="Dboire" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://poe2htc.com/" />
    <meta property="og:title" content="POE2HTC - Path of Exile 2 Crafting Calculator" />
    <meta property="og:description" content="Free Path of Exile 2 crafting calculator. Find optimal crafting paths and calculate success probabilities." />
    <meta property="og:image" content="https://poe2htc.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="POE2 HTC — a hammer and anvil over the site name" />
    <meta property="og:site_name" content="POE2 HTC" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://poe2htc.com/" />
    <meta name="twitter:title" content="POE2HTC - Path of Exile 2 Crafting Calculator" />
    <meta name="twitter:description" content="Free Path of Exile 2 crafting calculator. Find optimal crafting paths and calculate success probabilities." />
    <meta name="twitter:image" content="https://poe2htc.com/og.jpg" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://poe2htc.com/" />
    
    <!-- Caching is set by real response headers in vercel.json, not here: browsers ignore
         http-equiv Cache-Control for the document and never applied it to subresources at all. The
         tags that used to sit here said "no-store", which is the opposite of what this site wants —
         every asset filename is content-hashed, so they can be cached forever and only index.html
         needs revalidating. A 3.1 MB mods.json re-downloaded on every visit was the cost. -->

    <!-- The Content-Security-Policy is a REAL RESPONSE HEADER, set in vercel.json — not a meta tag.
         A meta CSP silently ignores `frame-ancestors`, so the one that used to live here never
         stopped anyone iframing the site; and being part of the document it applied in dev too, so
         the ws://localhost allowances Vite's HMR needs were shipping to production and could not be
         removed without breaking `npm run dev`. src/lib/deployConfig.test.ts pins the header. -->
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/x-icon" href="/icon.ico" />
    <link rel="apple-touch-icon" href="/icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
