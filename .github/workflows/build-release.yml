name: Build Release

# The app ships as a web page. This used to package Electron binaries for Windows and Linux; the
# desktop build was retired when the solver moved into a Web Worker (Chromium blocks module Workers
# from the file:// origin a packaged Electron app loads from), so a tag now produces the static site.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Bundle the site
        run: |
          version=$(node -p "require('./package.json').version")
          zip -r "POE2HTC-web-v${version}.zip" dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/**

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: POE2HTC-web-*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
