name: Build Release

# The app ships as a web page. This used to package Electron binaries for Windows and Linux; the
# desktop build was retired when the solver moved into a Web Worker (Chromium blocks module Workers
# from the file:// origin a packaged Electron app loads from), so a tag now produces the static site.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # `contents: write` publishes the release and attaches the zip. `discussions: write` is for the
    # Announcements post the release creates alongside itself — the release API accepts
    # `discussion_category_name`, but the token has to be allowed to write a discussion or the whole
    # call is refused, taking the release with it. Granted deliberately and narrowly rather than
    # discovered by a failed 1.0 tag.
    permissions:
      contents: write
      discussions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Bundle the site
        run: |
          version=$(node -p "require('./package.json').version")
          zip -r "POE2HTC-web-v${version}.zip" dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/**

      # The release NOTES, taken from the changelog rather than written twice.
      #
      # Without a body, `action-gh-release` publishes an empty release — which is what the repository
      # home page shows in its sidebar, so "1.0.0" would have appeared to everyone as a version number
      # and a zip file and nothing else. `generate_release_notes` would fill it with a commit list,
      # which is a worse answer than the changelog entry that already exists.
      #
      # Fails loudly when the tagged version has no changelog section. That is the right outcome: the
      # build has already succeeded by this point, so nothing is lost by stopping, and the alternative
      # is silently publishing the blank release this step exists to prevent.
      - name: Build the release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "**[Open POE2HTC](https://poe2htc.com)** — nothing to install, no account."
            echo
            echo "New here, or coming back? [What's new in ${version}](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/WHATS-NEW.md)"
            echo "is the tour; the [User Guide](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/USER_GUIDE.md)"
            echo "walks through a first craft."
            echo
            echo "---"
            echo
            # The section for THIS version only: from its own heading to the next one.
            awk -v v="## [$version]" '
              index($0, v) == 1 { inside = 1; print; next }
              inside && /^## \[/ { exit }
              inside { print }
            ' docs/CHANGELOG.md
          } > RELEASE_NOTES.md
          if ! grep -q '^## \[' RELEASE_NOTES.md; then
            echo "::error::docs/CHANGELOG.md has no '## [$version]' section — write it before tagging."
            exit 1
          fi
          echo "--- release notes ($(wc -l < RELEASE_NOTES.md) lines) ---"
          head -20 RELEASE_NOTES.md

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        # Pinned to a COMMIT, not the `v2` tag. A tag is mutable: whoever controls the action can
        # repoint it at new code, which then runs inside this job — and this job holds
        # `contents: write` on your repository. First-party actions/* and github/* by tag is normal
        # practice; a third-party action with write access is the one that earns a SHA.
        # 3bb1273 is the v2 tag as of 2026-08-24 (release 2.6.2). To update: re-resolve the tag,
        # read the diff, then move this deliberately.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: POE2HTC-web-*.zip
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          # Post the release as an Announcements discussion too. The repository has 34 stars and ZERO
          # watchers, so a release notifies nobody on its own — it is visible to whoever happens to
          # open the repository page, and that is all. A discussion is the part people can subscribe
          # to and reply in.
          #
          # This is the category's NAME, without the 📣 GitHub shows beside it (the emoji is stored
          # separately). A name that does not match makes the GitHub API reject the whole call — and
          # since the release and its discussion are created together, that means NO release rather
          # than a release without a discussion. If it ever fails that way: fix the name, then
          # `git tag -d v1.0.0 && git push origin :v1.0.0` and re-tag. Nothing is half-published,
          # because the API call is atomic.
          discussion_category_name: Announcements
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
