name: CI

on:
  push:
    branches: [ revival, main ]
  pull_request:

jobs:
  verify:
    name: Type-check, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # `npm ci` would be preferable, but package-lock.json is gitignored, so there is no
      # lockfile to install from. Switch this to `npm ci` if the lockfile is ever committed.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

      - name: Build Electron main process
        run: npm run build:electron
