name: CodeQL Security Analysis

on:
  push:
    branches: [ main, revival ]
  pull_request:
  schedule:
    - cron: '0 0 * * 1' # Weekly on Monday

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # `javascript-typescript` covers both; this project is TypeScript throughout. The Java
      # analysis that used to sit alongside it was removed — it looked for a pom.xml that was
      # deleted when the Java backend was retired, so it failed on every run.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Build
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
