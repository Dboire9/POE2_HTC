name: CI

on:
  push:
    branches: [ revival, main ]
  pull_request:

jobs:
  verify:
    name: Type-check, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # `npm ci` installs exactly the committed lockfile — so CI and a developer's machine get the
      # same tree, and a clean `npm audit` stays clean. legacy-peer-deps comes from .npmrc.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      # The package configs are STRICTER than the root one (exactOptionalPropertyTypes,
      # noUncheckedIndexedAccess) and the root config only includes `src`, so root-only checking let
      # real errors sit in packages/ unnoticed. Check them explicitly.
      - name: Type check engine + optimizer
        run: npm run type-check:engine && npm run type-check:optimizer

      - name: Test
        run: npm test -- --run

      - name: Build frontend
        run: npm run build
